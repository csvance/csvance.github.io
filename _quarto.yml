project:
  type: website
  output-dir: _site
  pre-render: scripts/snippets.py   # copy marked code regions from companion repos

website:
  title: "∇ Selected Gradient Works"
  description: "Notes on Julia and machine learning engineering"
  site-url: https://csvance.dev
  repo-url: https://github.com/csvance/csvance.github.io
  search: false            # removes the search script and index
  open-graph: true         # link previews on Hacker News, Slack, etc.
  navbar:
    right:
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/csvance
      - icon: rss
        href: index.xml
  page-footer:
    center: "© 2026 Carroll Vance · [MIT License](https://github.com/csvance/csvance.github.io/blob/main/LICENSE)"

format:
  html:
    theme:                    # light/dark pair; colors live in the .scss files
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true   # follow the OS setting; navbar toggle overrides
    css: styles.css
    syntax-highlighting: github   # Pandoc highlighting, no JavaScript; adapts to dark
    code-copy: false          # removes the clipboard script
    anchor-sections: false    # removes the anchor link script
    smooth-scroll: false
    link-external-icon: false
